[package]
name = "turboterm"
version = "0.1.3"
edition = "2021"

[lib]
name = "turboterm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
doc = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28.1", features = ["abi3-py311", "experimental-inspect"] }
pyo3-stub-gen = "0.19"
clap = { version = "4.0", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string"] }
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
